<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner - Age of Heroes Helper</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Luxury Animated Background */
.container {
  position: relative;
  width: 100%;
  min-height: 100vh;
  background: radial-gradient(circle at 20% 30%, #1a2226 0%, #0d1113 70%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-y: auto;
  font-family: 'Segoe UI', Arial, sans-serif;
  padding: 40px 20px;
}

.container::before {
  content: "";
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: radial-gradient(#bd9f67 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.04;
  animation: backgroundShift 180s linear infinite;
  pointer-events: none;
}

@keyframes backgroundShift {
  0% { transform: translate(0, 0); }
  100% { transform: translate(-50%, -50%); }
}

.content {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  text-align: center;
  background: #243137;
  padding: 40px;
  border-radius: 10px;
  border: 1px solid rgba(189, 159, 103, 0.2);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  width: 100%;
  max-width: 800px;
  margin: auto;
}

h1 {
  color: #bd9f67;
  font-size: 2.2rem;
  font-weight: 400;
  letter-spacing: 2px;
  text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  margin-bottom: 10px;
}

label {
  color: #e0d0b5;
  font-size: 1rem;
  letter-spacing: 0.5px;
}

#dateInputContainer {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 5px;
}

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

input[type="text"], input[type="number"] {
  background: #1a2226;
  border: 1px solid rgba(189, 159, 103, 0.4);
  border-radius: 4px;
  padding: 10px 14px;
  color: #e0d0b5;
  font-size: 1rem;
  text-align: center;
  outline: none;
  transition: all 0.3s ease;
}

input[type="text"]:focus, input[type="number"]:focus {
  border-color: #bd9f67;
  box-shadow: 0 0 10px rgba(189, 159, 103, 0.3);
}

input[type="checkbox"] {
  accent-color: #bd9f67;
  width: 16px;
  height: 16px;
  cursor: pointer;
}

/* ==========================================================================
   Global Button Upgrade - Universal Conic Aura Matrix
   ========================================================================== */
button {
  position: relative;
  display: inline-block;
  padding: 12px 28px;
  font-size: 15px;
  font-weight: bold;
  background: transparent !important;
  border: none !important;
  cursor: pointer;
  border-radius: 50px !important;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.3s ease;
  z-index: 1;
}

button:hover {
  transform: scale(1.04);
  box-shadow: 0 0 20px rgba(189, 159, 103, 0.3);
}

button::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: conic-gradient(
    from 0deg,
    #bd9f67 0%,
    #e0d0b5 25%,
    #9c8252 50%,
    #f3e8d5 75%,
    #bd9f67 100%
  );
  z-index: -2;
  filter: blur(4px);
  transform: rotate(0deg);
  transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
}

button:hover::before {
  transform: rotate(180deg);
}

button::after {
  content: "";
  position: absolute;
  inset: 2px;
  background: #1a2226; 
  border-radius: 48px;
  z-index: -1;
  transition: background 0.4s ease;
}

button:hover::after {
  background: rgba(189, 159, 103, 0.08);
}

/* Typography Color Transition Mapping */
button span {
  display: block;
  position: relative;
  z-index: 2;
  font-weight: bold;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #e0d0b5; 
  transition: color 0.3s ease, text-shadow 0.3s ease;
}

button:hover span {
  color: #ffffff; 
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); 
}

button:active {
  transform: scale(0.98);
}

.button-group {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 10px;
}

/* Custom Table and Output Configurations */
#planResultContainer {
  width: 100%;
  max-height: 400px;
  overflow-y: auto;
  margin-top: 25px;
  border: 1px solid rgba(189, 159, 103, 0.2);
  border-radius: 6px;
  background: #1a2226;
}

/* Scrollbar customizations */
#planResultContainer::-webkit-scrollbar {
  width: 8px;
}
#planResultContainer::-webkit-scrollbar-track {
  background: #1a2226;
}
#planResultContainer::-webkit-scrollbar-thumb {
  background: rgba(189, 159, 103, 0.3);
  border-radius: 4px;
}
#planResultContainer::-webkit-scrollbar-thumb:hover {
  background: #bd9f67;
}

table {
  width: 100%;
  border-collapse: collapse;
  color: #e0d0b5;
  font-size: 0.95rem;
  text-align: center;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid rgba(189, 159, 103, 0.1);
}

th {
  background: rgba(189, 159, 103, 0.15);
  color: #bd9f67;
  font-weight: bold;
  letter-spacing: 1px;
  position: sticky;
  top: 0;
  z-index: 5;
  box-shadow: 0 2px 0 rgba(189, 159, 103, 0.2);
}

tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
tr:nth-child(odd) { background: rgba(0, 0, 0, 0.1); }
tr:hover { background: rgba(189, 159, 103, 0.05); }

footer {
  margin-top: 20px;
  font-size: 0.85rem;
}

a {
  color: #bd9f67;
  text-decoration: none;
  transition: color 0.3s ease;
}

a:hover {
  color: #e0d0b5;
  text-decoration: underline;
}

/* ─── Mobile ─── */
@media (max-width: 640px) {
  .content { padding: 20px 14px; }
  h1 { font-size: 1.7rem; letter-spacing: 1px; }
  #dateInputContainer { flex-direction: column; align-items: stretch; }
  #dateInputContainer label { text-align: center; }
  .button-group { flex-direction: column; align-items: center; }
  button { width: 220px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="content">
    <h1>Level Planner</h1>
    
    <div id="dateInputContainer">
      <label for="startDate">Starting Date:</label>
      <input type="text" id="startDate" placeholder="MM/DD/YYYY" maxlength="10" autocomplete="off" style="width: 140px;">
      <button onclick="useToday()" style="padding: 9px 16px; font-size: 0.85rem;"><span>Today</span></button>
      <label class="checkbox-label" style="margin-left:15px;">
        <input type="checkbox" id="includeYear" checked> Include Year
      </label>
    </div>
    
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 10px;">
      <div>
        <label>Days to plan: </label>
        <input type="number" id="days" placeholder="Days" value="10" style="width: 100px;">
      </div>
      <div>
        <label>Stop at level (optional): </label>
        <input type="number" id="benchmark" placeholder="e.g. 5000" style="width: 120px;">
      </div>
    </div>
    
    <div class="button-group">
      <button onclick="planLevels()"><span>Generate Plan</span></button>
      <button onclick="downloadCSV()"><span>Download CSV</span></button>
      <button onclick="importCSV()"><span>Import CSV</span></button>
    </div>

    <div id="planResultContainer">
      <div id="planResult">
        <div style="padding: 30px; color: rgba(189, 159, 103, 0.4); font-style: italic;">No progression sequence generated. Configure options above.</div>
      </div>
    </div>

    <footer>
      <button onclick="goBack()" class="back-btn"><span>Back</span></button>
      <a href="credits.html">Credits &amp; License</a> · <a href="#" id="changelogLink">Changelog</a>
    </footer>
  </div>
</div>
<script>
function getLevelFromURL() {
  const params = new URLSearchParams(window.location.search);
  const lvl = Number(params.get("level"));
  return (lvl && lvl > 0) ? lvl : null;
}

let playerLevel = getLevelFromURL();
if (!playerLevel) {
  playerLevel = 1500; 
}

let tableData = [];

// XP required to go from level L to level L+1
function xpForLevel(L) {
    return 12 * Math.pow(L, 1.5);
}

// Total XP required to go from level `start` to level `end` (end > start)
function xpForRange(start, end) {
    let total = 0;
    for (let L = start; L < end; L++) {
        total += xpForLevel(L);
    }
    return total;
}

function getDailyLimit(level) {
    if(level <= 999) return 999;
    if(level <= 1999) return 120;
    if(level <= 2999) return 88;
    if(level <= 3999) return 82;
    if(level <= 4999) return 74;
    if(level <= 5999) return 69;
    if(level <= 6999) return 62;
    if(level <= 7999) return 54;
    if(level <= 8999) return 46;
    if(level <= 9999) return 40;
    if(level <= 10500) return 34;
    if(level <= 10999) return 30;
    if(level <= 11999) return 26;
    if(level <= 12999) return 23;
    if(level <= 13999) return 21;
    if(level <= 14999) return 18;
    if(level <= 15999) return 14;
    if(level <= 16999) return 11;
    if(level <= 17999) return 7;
    if(level <= 18999) return 4;
    if(level <= 19999) return 2;
    return 1;
}

function parseDateInput(input) {
  const parts = input.trim().split('/');
  if(parts.length < 2 || parts.length > 3) return null;
    
  let month = Number(parts[0]);
  let day = Number(parts[1]);
  let year = parts.length === 3 ? Number(parts[2]) : (new Date()).getFullYear();
    
  if(isNaN(month) || isNaN(day) || isNaN(year)) return null;
  if(month < 1 || month > 12) return null;
  if(day < 1 || day > 31) return null;
    
  let d = new Date(year, month-1, day);
  if(d.getFullYear()!==year || d.getMonth() !== month-1 || d.getDate() !== day) return null;
  return d;
}

function formatDate(d, includeYear){
  let m = d.getMonth() + 1;
  let day = d.getDate();
  let y = d.getFullYear();
  let formatted = `${m}/${day}`;
  if(includeYear) formatted += `/${y}`;
  return formatted;
}

function useToday(){
  let today = new Date();
  let m = today.getMonth() + 1;
  let d = today.getDate();
  let y = today.getFullYear();
  document.getElementById('startDate').value = m + "/" + d + "/" + y;
}

function planLevels(){
    const days = Number(document.getElementById("days").value);
    const benchmark = Number(document.getElementById("benchmark").value);
    const dateInput = document.getElementById("startDate").value;
    const includeYear = document.getElementById("includeYear").checked;

    if(!dateInput.trim()){
      alert("Please enter a valid starting date.");
      return;
    }
    const startDate = parseDateInput(dateInput);
    if(!startDate){
      alert("Invalid date format. Use MM/DD/YYYY or MM/DD.");
      return;
    }
    if(!(days > 0)){
      alert("Enter a valid number of days > 0.");
      return;
    }

    let lvl = playerLevel;
    let xpTotal = 0;
    tableData = [];

    let html = `<table><tr><th>Day</th><th>Date</th><th>Start Level</th><th>Daily Limit</th><th>End Level</th><th>XP Gained</th><th>Total XP</th></tr>`;
    
    for(let i=1; i<=days; i++){
        const daily = getDailyLimit(lvl);
        const start = lvl;
        const end = lvl + daily;
        const xpGained = xpForRange(start, end);
        xpTotal += xpGained;

        let currentDate = new Date(startDate);
        currentDate.setDate(startDate.getDate() + i - 1);
        const dateStr = formatDate(currentDate, includeYear);

        html += `<tr><td>${i}</td><td>${dateStr}</td><td>${start}</td><td>+${daily}</td><td>${end}</td><td>${Math.round(xpGained).toLocaleString()}</td><td>${Math.round(xpTotal).toLocaleString()}</td></tr>`;
        tableData.push([i, dateStr, start, daily, end, Math.round(xpGained), Math.round(xpTotal)]);
        lvl = end;
        if(benchmark && lvl >= benchmark) break;
    }
    html += `</table>`;
    document.getElementById("planResult").innerHTML = html;

    sessionStorage.setItem("plannerData", JSON.stringify(tableData));
}

function downloadCSV() {
    if(tableData.length === 0){ alert("Generate the plan first."); return; }
    let csvContent = "data:text/csv;charset=utf-8,Day,Date,Start Level,Daily Limit,End Level,XP Gained,Total XP\n";
    tableData.forEach(row => { csvContent += row.join(",") + "\n"; });
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "level_plan.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function importCSV(){
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".csv";
    input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = evt => {
            const text = evt.target.result;
            const lines = text.split("\n").slice(1); 
            tableData = [];
            let html = `<table><tr><th>Day</th><th>Date</th><th>Start Level</th><th>Daily Limit</th><th>End Level</th><th>XP Gained</th><th>Total XP</th></tr>`;
            for(let line of lines){
                if(line.trim()==="") continue;
                const [day, dateStr, start, daily, end, xpGained, xpTotal] = line.split(",");
                const xpG = xpGained !== undefined ? Number(xpGained) : xpForRange(Number(start), Number(end));
                const xpT = xpTotal !== undefined ? Number(xpTotal) : xpG;
                html += `<tr><td>${day}</td><td>${dateStr}</td><td>${start}</td><td>+${daily}</td><td>${end}</td><td>${xpG.toLocaleString()}</td><td>${xpT.toLocaleString()}</td></tr>`;
                tableData.push([Number(day), dateStr, Number(start), Number(daily), Number(end), xpG, xpT]);
            }
            html += `</table>`;
            document.getElementById("planResult").innerHTML = html;
        };
        reader.readAsText(file);
    };
    input.click();
}

function goBack(){ window.location.href="welcome_main.html?level=" + playerLevel; }

document.getElementById("changelogLink").href = "changelog.html?level=" + playerLevel;
</script>
</body>
</html>
