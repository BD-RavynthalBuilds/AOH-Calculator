<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOH Helper</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Luxury Animated Background matched to dailies */
.container {
  position: relative;
  width: 100%;
  min-height: 100vh;
  background: radial-gradient(circle at 20% 30%, #1a2226 0%, #0d1113 70%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
}

.container::before {
  content: "";
  position: absolute;
  width: 150%;
  height: 150%;
  background-image: radial-gradient(#bd9f67 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.04;
  animation: backgroundShift 180s linear infinite;
}

@keyframes backgroundShift {
  0% { transform: translate(0, 0); }
  100% { transform: translate(-50%, -50%); }
}

.content {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  text-align: center;
  background: #243137;
  padding: 40px;
  border-radius: 10px;
  border: 1px solid rgba(189, 159, 103, 0.2);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
}

h1 {
  color: #bd9f67;
  font-size: 2.2rem;
  font-weight: 400;
  letter-spacing: 2px;
  text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
}

p {
  color: #e0d0b5;
  font-size: 1.1rem;
}

input[type="number"] {
  background: #1a2226;
  border: 1px solid #bd9f67;
  border-radius: 4px;
  padding: 12px;
  color: #e0d0b5;
  font-size: 1.1rem;
  text-align: center;
  width: 180px;
  outline: none;
  transition: all 0.3s ease;
}

input[type="number"]:focus {
  box-shadow: 0 0 10px rgba(189, 159, 103, 0.3);
}

/* ==========================================================================
   Global Button Upgrade - Universal Conic Aura Matrix
   ========================================================================== */
button {
  position: relative;
  display: inline-block;
  padding: 12px 28px;
  font-size: 15px;
  font-weight: bold;
  background: transparent !important;
  border: none !important;
  cursor: pointer;
  border-radius: 50px !important;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.3s ease;
  z-index: 1;
  text-decoration: none;
}

button:hover {
  transform: scale(1.04);
  box-shadow: 0 0 20px rgba(189, 159, 103, 0.3);
}

button::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: conic-gradient(
    from 0deg,
    #bd9f67 0%,
    #e0d0b5 25%,
    #9c8252 50%,
    #f3e8d5 75%,
    #bd9f67 100%
  );
  z-index: -2;
  filter: blur(4px);
  transform: rotate(0deg);
  transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
}

button:hover::before {
  transform: rotate(180deg);
}

button::after {
  content: "";
  position: absolute;
  inset: 2px;
  background: #1a2226;
  border-radius: 48px;
  z-index: -1;
  transition: background 0.4s ease;
}

button:hover::after {
  background: rgba(189, 159, 103, 0.08);
}

button span {
  display: block;
  position: relative;
  z-index: 2;
  font-weight: bold;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #e0d0b5;
  transition: color 0.3s ease, text-shadow 0.3s ease;
}

button:hover span {
  color: #ffffff;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
}

button:active {
  transform: scale(0.98);
}


@media (max-width: 480px) {
  .content { padding: 24px 16px; width: 92%; }
  h1 { font-size: 1.7rem; }
  input[type="number"] { width: 140px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="content">
    <h1>Welcome to AOH Helper</h1>
    <p>Enter your current level to start:</p>
    <input type="number" id="levelInput" placeholder="Your Level" min="1">
    <button onclick="start()"><span>Start</span></button>
  </div>
</div>
<script>
function start() {
    let lvl = Number(document.getElementById("levelInput").value);
    if(!lvl || lvl <= 0){ 
        alert("Enter a valid level.");
        return;
    }
    window.location.href = "welcome_main.html?level=" + lvl;
}
</script>
</body>
</html>
