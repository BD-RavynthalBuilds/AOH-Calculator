<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XP Calculator - Age of Heroes Helper</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Luxury Animated Background */
.container {
  position: relative;
  width: 100%;
  min-height: 100vh;
  background: radial-gradient(circle at 20% 30%, #1a2226 0%, #0d1113 70%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-y: auto;
  font-family: 'Segoe UI', Arial, sans-serif;
  padding: 40px 20px;
}

.container::before {
  content: "";
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: radial-gradient(#bd9f67 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.04;
  animation: backgroundShift 180s linear infinite;
  pointer-events: none;
}

@keyframes backgroundShift {
  0% { transform: translate(0, 0); }
  100% { transform: translate(-50%, -50%); }
}

.content {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  text-align: center;
  background: #243137;
  padding: 40px;
  border-radius: 10px;
  border: 1px solid rgba(189, 159, 103, 0.2);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  width: 100%;
  max-width: 560px;
  margin: auto;
}

h1 {
  color: #bd9f67;
  font-size: 2.2rem;
  font-weight: 400;
  letter-spacing: 2px;
  text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  margin-bottom: 4px;
}

.subtitle {
  color: #a49683;
  font-size: 0.85rem;
  margin-top: -14px;
}

label {
  color: #e0d0b5;
  font-size: 1rem;
  letter-spacing: 0.5px;
}

.input-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 4px;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
}

input[type="number"] {
  background: #1a2226;
  border: 1px solid rgba(189, 159, 103, 0.4);
  border-radius: 4px;
  padding: 10px 14px;
  color: #e0d0b5;
  font-size: 1rem;
  text-align: center;
  outline: none;
  width: 140px;
  transition: all 0.3s ease;
}

input[type="number"]:focus {
  border-color: #bd9f67;
  box-shadow: 0 0 10px rgba(189, 159, 103, 0.3);
}

/* ==========================================================================
   Global Button Upgrade - Universal Conic Aura Matrix
   ========================================================================== */
button {
  position: relative;
  display: inline-block;
  padding: 12px 28px;
  font-size: 15px;
  font-weight: bold;
  background: transparent !important;
  border: none !important;
  cursor: pointer;
  border-radius: 50px !important;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.3s ease;
  z-index: 1;
}

button:hover {
  transform: scale(1.04);
  box-shadow: 0 0 20px rgba(189, 159, 103, 0.3);
}

button::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: conic-gradient(
    from 0deg,
    #bd9f67 0%,
    #e0d0b5 25%,
    #9c8252 50%,
    #f3e8d5 75%,
    #bd9f67 100%
  );
  z-index: -2;
  filter: blur(4px);
  transform: rotate(0deg);
  transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
}

button:hover::before {
  transform: rotate(180deg);
}

button::after {
  content: "";
  position: absolute;
  inset: 2px;
  background: #1a2226;
  border-radius: 48px;
  z-index: -1;
  transition: background 0.4s ease;
}

button:hover::after {
  background: rgba(189, 159, 103, 0.08);
}

button span {
  display: block;
  position: relative;
  z-index: 2;
  font-weight: bold;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #e0d0b5;
  transition: color 0.3s ease, text-shadow 0.3s ease;
}

button:hover span {
  color: #ffffff;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
}

button:active {
  transform: scale(0.98);
}

.button-group {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 6px;
}

/* Result Display */
#resultBox {
  width: 100%;
  margin-top: 10px;
  padding: 22px;
  background: #1a2226;
  border: 1px solid rgba(189, 159, 103, 0.2);
  border-radius: 6px;
}

#resultBox .result-label {
  color: #a49683;
  font-size: 0.8rem;
  letter-spacing: 1px;
  text-transform: uppercase;
}

#resultBox .result-value {
  color: #bd9f67;
  font-size: 1.9rem;
  font-weight: bold;
  margin-top: 6px;
  word-break: break-all;
}

#resultBox .result-sub {
  color: #e0d0b5;
  font-size: 0.8rem;
  margin-top: 8px;
  opacity: 0.75;
}

.formula-note {
  color: rgba(189, 159, 103, 0.5);
  font-size: 0.75rem;
  font-style: italic;
  margin-top: -8px;
}

/* Breakdown table */
#breakdownWrap {
  width: 100%;
  max-height: 300px;
  overflow-y: auto;
  margin-top: 10px;
  border: 1px solid rgba(189, 159, 103, 0.2);
  border-radius: 6px;
  background: #1a2226;
  display: none;
}

#breakdownWrap::-webkit-scrollbar { width: 8px; }
#breakdownWrap::-webkit-scrollbar-track { background: #1a2226; }
#breakdownWrap::-webkit-scrollbar-thumb {
  background: rgba(189, 159, 103, 0.3);
  border-radius: 4px;
}
#breakdownWrap::-webkit-scrollbar-thumb:hover { background: #bd9f67; }

table {
  width: 100%;
  border-collapse: collapse;
  color: #e0d0b5;
  font-size: 0.9rem;
  text-align: center;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid rgba(189, 159, 103, 0.1);
}

th {
  background: rgba(189, 159, 103, 0.15);
  color: #bd9f67;
  font-weight: bold;
  letter-spacing: 1px;
  position: sticky;
  top: 0;
  z-index: 5;
  box-shadow: 0 2px 0 rgba(189, 159, 103, 0.2);
}

tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
tr:nth-child(odd) { background: rgba(0, 0, 0, 0.1); }
tr:hover { background: rgba(189, 159, 103, 0.05); }

footer {
  margin-top: 20px;
  font-size: 0.85rem;
}

a {
  color: #bd9f67;
  text-decoration: none;
  transition: color 0.3s ease;
}

a:hover {
  color: #e0d0b5;
  text-decoration: underline;
}

@media (max-width: 640px) {
  .content { padding: 20px 14px; }
  h1 { font-size: 1.7rem; letter-spacing: 1px; }
  .input-row { flex-direction: column; }
  input[type="number"] { width: 180px; }
  .button-group { flex-direction: column; align-items: center; }
  button { width: 220px; }
  #resultBox .result-value { font-size: 1.4rem; }
}
</style>
</head>
<body>
<div class="container">
  <div class="content">
    <h1>XP Calculator</h1>
    <p class="subtitle">Total XP required between two levels</p>

    <div class="input-row">
      <div class="input-group">
        <label for="fromLevel">From Level</label>
        <input type="number" id="fromLevel" placeholder="e.g. 1120" min="1">
      </div>
      <div class="input-group">
        <label for="toLevel">To Level</label>
        <input type="number" id="toLevel" placeholder="e.g. 1240" min="1">
      </div>
    </div>

    <div class="button-group">
      <button onclick="calculateXP()"><span>Calculate</span></button>
      <button onclick="toggleBreakdown()" id="breakdownToggleBtn" style="display:none;"><span>Show Breakdown</span></button>
    </div>

    <div id="resultBox" style="display:none;">
      <div class="result-label">Total XP Needed</div>
      <div class="result-value" id="resultValue">0</div>
      <div class="result-sub" id="resultSub"></div>
    </div>

    <div id="breakdownWrap">
      <table>
        <thead><tr><th>Level</th><th>XP for this level</th><th>Running Total</th></tr></thead>
        <tbody id="breakdownBody"></tbody>
      </table>
    </div>

    <footer>
      <a href="welcome_main.html" id="hubLink">Back to Hub</a>
    </footer>
  </div>
</div>
<script>
function getLevelFromURL() {
  const params = new URLSearchParams(window.location.search);
  const lvl = Number(params.get("level"));
  return (lvl && lvl > 0) ? lvl : null;
}

let playerLevel = getLevelFromURL();

// Pre-fill "From Level" with the player's current level, if known
if (playerLevel) {
  document.getElementById("fromLevel").value = playerLevel;
  document.getElementById("hubLink").href = "welcome_main.html?level=" + playerLevel;
}

// XP required to go from level L to level L+1
function xpForLevel(L) {
  return 12 * Math.pow(L, 1.5);
}

let lastBreakdown = [];

function calculateXP() {
  const from = Number(document.getElementById("fromLevel").value);
  const to = Number(document.getElementById("toLevel").value);

  if (!from || from <= 0 || !to || to <= 0) {
    alert("Enter valid levels for both fields.");
    return;
  }
  if (to <= from) {
    alert("'To Level' must be greater than 'From Level'.");
    return;
  }

  let total = 0;
  lastBreakdown = [];
  for (let L = from; L < to; L++) {
    const xp = xpForLevel(L);
    total += xp;
    lastBreakdown.push([L, xp, total]);
  }

  document.getElementById("resultValue").textContent = Math.round(total).toLocaleString();
  document.getElementById("resultSub").textContent =
    `Level ${from} → ${to} (${to - from} level${to - from === 1 ? "" : "s"})`;
  document.getElementById("resultBox").style.display = "block";

  document.getElementById("breakdownToggleBtn").style.display = "inline-block";
  document.getElementById("breakdownWrap").style.display = "none";
  document.getElementById("breakdownToggleBtn").querySelector("span").textContent = "Show Breakdown";

  const body = document.getElementById("breakdownBody");
  body.innerHTML = lastBreakdown.map(row =>
    `<tr><td>${row[0]}</td><td>${Math.round(row[1]).toLocaleString()}</td><td>${Math.round(row[2]).toLocaleString()}</td></tr>`
  ).join("");
}

function toggleBreakdown() {
  const wrap = document.getElementById("breakdownWrap");
  const btnSpan = document.getElementById("breakdownToggleBtn").querySelector("span");
  const isOpen = wrap.style.display === "block";
  wrap.style.display = isOpen ? "none" : "block";
  btnSpan.textContent = isOpen ? "Show Breakdown" : "Hide Breakdown";
}

function goBack() {
  window.location.href = "welcome_main.html" + (playerLevel ? ("?level=" + playerLevel) : "");
}
</script>
</body>
</html>
